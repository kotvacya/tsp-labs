services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tspy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tspy_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  grpc-compute:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "src/grpc_service/server.py"]
    environment:
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: 50051
    volumes:
      - ./data:/app/data:ro
      - ./checkpoints:/app/checkpoints:ro
    expose:
      - "50051"
    ports:
      - "50051:50051"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tspy_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tspy_test_db
      SECRET_KEY: ${SECRET_KEY:-insecure-docker-secret-key-change-in-production}
      GRPC_COMPUTE_HOST: grpc-compute
      GRPC_COMPUTE_PORT: 50051
    volumes:
      - ./data:/app/data:ro
      - ./checkpoints:/app/checkpoints:ro
    depends_on:
      db:
        condition: service_healthy
      grpc-compute:
        condition: service_started
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/static:/usr/share/nginx/html:ro
      - ./data:/var/www/datasets:ro
    depends_on:
      - api

volumes:
  pgdata:
